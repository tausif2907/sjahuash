[project]
name = "wind-forecast-monitor-backend"
version = "0.1.0"
description = "API and data pipeline for the UK wind forecast monitor"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
